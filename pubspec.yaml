name: pocket_ledger
description: A local-first desktop expense tracker built with Flutter.
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  csv: ^8.0.0
  file_picker: ^13.3.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite_common: ^2.5.8
  sqflite_common_ffi: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
